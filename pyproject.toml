[project]
name = "minimax-h3-diffsynth"
version = "0.1.0"
description = "MiniMax-H3 FL2VA local inference with DiffSynth + NF4 + Turbo LoRA (CUDA)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "diffsynth[all]",
    "bitsandbytes",
    "huggingface_hub",
    "torch",
    "torchvision",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
